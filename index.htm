<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerario di Viaggio</title>
    <link rel="icon" type="image/jpeg" href="1.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .map-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
        }
        #osm-map {
            width: 100%;
            height: 100%;
        }
        #vessel-map-container, #marine-map-container {
            display: none;
            width: 100%;
            height: 100%;
        }
        .map-control-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: #111;
            border: 1px solid #333;
            color: var(--accent-3);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }
        .map-control-btn:hover {
            background: var(--accent-3);
            color: white;
        }
        .header-controls {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #222;
        }
        .map-switch-btn {
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }
        .map-switch-btn:hover { background: #222; }
        .map-switch-btn.active { background: var(--accent-3); border-color: var(--accent-3); }

        .current-date-display {
            background: #111;
            border: 1px solid #333;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-3);
            text-transform: capitalize;
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            width: fit-content;
            text-align: center;
            align-items: center;
            cursor: pointer;
        }
        .countdown-timer {
            font-size: 0.65rem;
            color: #888;
            margin-top: 3px;
        }

        /* Personalizzazione Popup Leaflet */
        .leaflet-popup-content-wrapper {
            background: #111 !important;
            color: white !important;
            border-radius: 1rem !important;
            border: 1px solid #333;
            padding: 0;
        }
        .leaflet-popup-content { margin: 0 !important; width: 220px !important; }
        .leaflet-popup-tip { background: #111 !important; }
        
        .popup-card { display: flex; flex-direction: column; }
        .popup-info { padding: 15px; }
        .popup-info h3 { margin: 0 0 5px; font-size: 1.1rem; color: var(--accent-3); }
        .popup-info p { margin: 0; font-size: 0.85rem; opacity: 0.9; line-height: 1.4; }

        /* Stile per l'icona della nave AIS */
        .ship-marker-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ship-icon-svg {
            fill: var(--accent-3);
            stroke: white;
            stroke-width: 1px;
        }
        /* Numeri sopra le tappe */
        .marker-label {
            background: #111;
            border: 1px solid var(--accent-3);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-controls">
            <button class="map-switch-btn" id="show-vessel">VesselFinder</button>
            <div class="current-date-display" id="reset-map" title="Torna alla mappa itinerario">
                <span id="date-text"></span>
                <span id="countdown-text" class="countdown-timer"></span>
            </div>
            <button class="map-switch-btn" id="show-marine">MarineTraffic</button>
        </div>
        <div class="map-wrapper">
            <div id="osm-map"></div>
            <div id="vessel-map-container"></div>
            <div id="marine-map-container"></div>
            <button id="center-map-btn" class="map-control-btn">Centra Mappa</button>
        </div>
    </header>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateText = document.getElementById('date-text');
            const countdownText = document.getElementById('countdown-text');

            // --- CONFIGURAZIONE POSIZIONE REALE ---
            // Se vuoi forzare la posizione della nave (es. presa da MarineTraffic), 
            // inserisci le coordinate qui [lat, lon]. Se null, usa l'itinerario.
            const manualAISPosition = [44.3129, 8.4764]; // Esempio: Savona. Cambia questi numeri!

            // Gestione Data Odierna
            const now = new Date();
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
            dateText.textContent = now.toLocaleDateString('it-IT', dateOptions);

            // Configurazione Mappa Interattiva (OpenStreetMap)
            const osmMap = L.map('osm-map', {
                zoomControl: true,
                attributionControl: false
            }).setView([40.0, 0.0], 5);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 18
            }).addTo(osmMap);

            const cruiseDestinations = [
                { id: "savona", name: "Savona", coords: [44.3129, 8.4764], img: "1.jpg", date: "02 Apr 2026", info: "Partenza 17:30" },
                { id: "marsiglia", name: "Marsiglia", coords: [43.2965, 5.3698], img: "1.jpg", date: "03 Apr 2026", info: "09:00 - 18:00" },
                { id: "day-3", name: "In Navigazione", coords: [41.5, 3.5], img: "1.jpg", date: "04 Apr 2026", info: "Mar Mediterraneo" },
                { id: "valencia", name: "Valencia", coords: [39.4699, -0.3763], img: "1.jpg", date: "05 Apr 2026", info: "08:00 - 18:00" },
                { id: "cartagena", name: "Cartagena", coords: [37.6051, -0.9862], img: "1.jpg", date: "06 Apr 2026", info: "08:00 - 18:00" },
                { id: "malaga", name: "Malaga", coords: [36.7213, -4.4214], img: "1.jpg", date: "07 Apr 2026", info: "08:00 - 18:00" },
                { id: "cadice", name: "Cadice", coords: [36.5298, -6.2947], img: "1.jpg", date: "08 Apr 2026", info: "07:00 - 16:00" },
                { id: "lisbona", name: "Lisbona", coords: [38.7223, -9.1393], img: "1.jpg", date: "09 Apr 2026", info: "08:00 - 16:00" },
                { id: "day-9", name: "In Navigazione", coords: [36.0, -5.6], img: "1.jpg", date: "10 Apr 2026", info: "Stretto di Gibilterra" },
                { id: "alicante", name: "Alicante", coords: [38.3452, -0.4810], img: "1.jpg", date: "11 Apr 2026", info: "09:30 - 16:30" },
                { id: "barcellona", name: "Barcellona", coords: [41.3851, 2.1734], img: "1.jpg", date: "12 Apr 2026", info: "07:00 - 13:00" },
                { id: "day-12", name: "Savona (Ritorno)", coords: [44.3129, 8.4764], img: "1.jpg", date: "13 Apr 2026", info: "Arrivo 09:00" }
            ];

            // Mapping date -> ID per animazione pulsante
            const cruiseSchedule = {
                "2026-04-02": "savona", "2026-04-03": "marsiglia", "2026-04-04": "day-3",
                "2026-04-05": "valencia", "2026-04-06": "cartagena", "2026-04-07": "malaga",
                "2026-04-08": "cadice", "2026-04-09": "lisbona", "2026-04-10": "day-9",
                "2026-04-11": "alicante", "2026-04-12": "barcellona", "2026-04-13": "day-12"
            };
            
            const todayKey = now.toISOString().split('T')[0];
            const activeId = cruiseSchedule[todayKey];
            const scheduleKeys = Object.keys(cruiseSchedule);
            const activeIndex = scheduleKeys.indexOf(todayKey);
            
            let activeCoords = null;
            const todayDest = cruiseDestinations.find(d => d.id === activeId);
            if (todayDest) activeCoords = todayDest.coords;

            const shipFinalPos = manualAISPosition || activeCoords;

            // Disegna ITINERARIO (Semplice)
            const pathCoords = cruiseDestinations.map(d => d.coords);
            L.polyline(pathCoords, {
                color: '#06b6d4',
                weight: 3,
                opacity: 0.6
            }).addTo(osmMap);

            cruiseDestinations.forEach((dest, index) => {
                const popupHtml = `
                    <div class="popup-card">
                        <div class="popup-info">
                            <h3>Giorno ${index + 1}: ${dest.name}</h3>
                            <p><strong>${dest.date}</strong></p>
                            <p>${dest.info}</p>
                        </div>
                    </div>
                `;

                L.circleMarker(dest.coords, {
                    radius: 6,
                    fillColor: "#06b6d4",
                    color: "#fff",
                    weight: 2,
                    fillOpacity: 1
                }).addTo(osmMap).bindPopup(popupHtml, {
                    maxWidth: 220,
                    className: 'custom-cruise-popup'
                });

                // Aggiunge il numero del giorno sopra il marker
                L.marker(dest.coords, {
                    icon: L.divIcon({
                        className: 'marker-label',
                        html: `<span>${index + 1}</span>`,
                        iconSize: [20, 20],
                        iconAnchor: [10, 28] // Posizionato sopra il cerchietto della tappa
                    }),
                    interactive: false
                }).addTo(osmMap);
            });

            // Disegna l'icona della nave sulla posizione corretta
            if (shipFinalPos) {
                const shipIcon = L.divIcon({
                    className: 'ship-marker-container',
                    html: `
                        <svg class="ship-icon-svg" viewBox="0 0 24 24" width="30" height="30">
                            <path d="M4,15C4,15 5,18 12,18C19,18 20,15 20,15L22,13L20,11L4,11L2,13L4,15Z M10,11L11,5L13,5L14,11L10,11Z" />
                        </svg>
                    `,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                L.marker(shipFinalPos, { icon: shipIcon, zIndexOffset: 1000 })
                    .addTo(osmMap)
                    .bindPopup("<b>Posizione attuale della Costa Favolosa</b>");
                
                osmMap.setView(shipFinalPos, 6);
            } else {
                osmMap.fitBounds(L.polyline(pathCoords).getBounds(), { padding: [30, 30] });
            }

            // GESTIONE SWITCH MAPPE
            const osmEl = document.getElementById('osm-map');
            const vesselContainer = document.getElementById('vessel-map-container');
            const marineContainer = document.getElementById('marine-map-container');
            const centerBtn = document.getElementById('center-map-btn');
            const switchBtns = document.querySelectorAll('.map-switch-btn');

            const hideAll = () => {
                [osmEl, vesselContainer, marineContainer].forEach(el => el.style.display = 'none');
                centerBtn.style.display = 'none';
                switchBtns.forEach(btn => btn.classList.remove('active'));
            };

            document.getElementById('reset-map').addEventListener('click', () => {
                hideAll();
                osmEl.style.display = 'block';
                if (shipFinalPos) {
                    centerBtn.style.display = 'block';
                    setTimeout(() => {
                        osmMap.invalidateSize();
                        osmMap.setView(shipFinalPos, 6);
                    }, 100);
                }
            });

            document.getElementById('show-vessel').addEventListener('click', function() {
                hideAll();
                this.classList.add('active');
                vesselContainer.style.display = 'block';
                vesselContainer.innerHTML = `<iframe src="https://www.vesselfinder.com/aismap?imo=9479852&zoom=5&track=true" width="100%" height="100%" frameborder="0"></iframe>`;
            });

            document.getElementById('show-marine').addEventListener('click', function() {
                hideAll();
                this.classList.add('active');
                marineContainer.style.display = 'block';
                marineContainer.innerHTML = `<iframe src="https://www.marinetraffic.com/en/ais/embed/imo:9479852/zoom:5/centery:40/centerx:10/maptype:3/shownames:false/trackvessel:true" width="100%" height="100%" frameborder="0"></iframe>`;
            });

            if (shipFinalPos) {
                centerBtn.addEventListener('click', () => {
                    osmMap.flyTo(shipFinalPos, 10, { animate: true, duration: 1.5 });
                });
            } else {
                centerBtn.style.display = 'none';
            }

            // Countdown alla partenza (2 Aprile 2026)
            const startDate = new Date("2026-04-02");
            const diffTime = startDate - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                countdownText.textContent = `Partenza tra ${diffDays} giorni`;
            } else if (diffDays === 0) {
                countdownText.textContent = "Si parte oggi! 🚢";
            } else if (now < new Date("2026-04-14")) {
                countdownText.textContent = "Crociera in corso";
            }
        });
    </script>
</body>
</html>
