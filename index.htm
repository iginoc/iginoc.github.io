<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerario di Viaggio</title>
    <link rel="icon" type="image/jpeg" href="1.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .map-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
        }
        #osm-map {
            width: 100%;
            height: 100%;
        }
        #vessel-map-container, #marine-map-container {
            display: none;
            width: 100%;
            height: 100%;
        }
        .map-controls-top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .map-control-btn {
            background: #111;
            border: 1px solid #333;
            color: var(--accent-3);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }
        .map-control-btn:hover {
            background: var(--accent-3);
            color: white;
        }
        .header-controls {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #222;
        }
        .map-switch-btn, .home-btn {
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }
        .map-switch-btn:hover, .home-btn:hover { background: #222; }
        .map-switch-btn.active { background: var(--accent-3); border-color: var(--accent-3); }

        .home-btn {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        /* Personalizzazione Popup Leaflet */
        .leaflet-popup-content-wrapper {
            background: #111 !important;
            color: white !important;
            border-radius: 1rem !important;
            border: 1px solid #333;
            padding: 0;
        }
        .leaflet-popup-content { margin: 0 !important; width: 220px !important; }
        .leaflet-popup-tip { background: #111 !important; }
        
        .popup-card { display: flex; flex-direction: column; }
        .popup-info { padding: 15px; }
        .popup-info h3 { margin: 0 0 5px; font-size: 1.1rem; color: var(--accent-3); }
        .popup-info p { margin: 0; font-size: 0.85rem; opacity: 0.9; line-height: 1.4; }

        /* Stile per l'icona della nave AIS */
        .ship-marker-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ship-icon-svg {
            fill: var(--accent-3);
            stroke: white;
            stroke-width: 1px;
        }
        /* Numeri sopra le tappe */
        .marker-label {
            background: #111;
            border: 1px solid var(--accent-3);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .marker-label:hover { transform: scale(1.2); background: var(--accent-3); }

        #calendar-view {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            padding: 30px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .calendar-day {
            background-size: cover;
            background-position: center;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 100px;
            transition: all 0.3s ease;
        }
        .calendar-day.cruise { border-color: var(--accent-3); border-width: 2px; }
        .calendar-day.today { background-color: rgba(6, 182, 212, 0.4); border-color: white; box-shadow: 0 0 20px rgba(6, 182, 212, 0.3); }
        .calendar-day.past { opacity: 0.4; }
        .calendar-day .day-num { font-size: 1.5rem; font-weight: 900; color: white; white-space: nowrap; }
        .calendar-dest { font-size: 0.75rem; color: var(--accent-3); font-weight: 700; text-transform: uppercase; line-height: 1.2; }
        
        .calendar-banner-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .calendar-banner-img {
            max-width: 100%;
            width: 600px;
            height: auto;
            border-radius: 15px;
            border: 2px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .calendar-banner-img:hover {
            transform: scale(1.02);
            border-color: var(--accent-3);
        }

        /* Modal Dettaglio Calendario */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #111;
            border: 1px solid #333;
            border-radius: 20px;
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .modal-overlay.open .modal-content {
            transform: scale(1);
        }
        .modal-close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #aaa;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            transition: color 0.2s;
        }
        .modal-close-btn:hover {
            color: var(--accent-3);
        }
        .modal-body {
            display: flex;
            flex-direction: row;
            height: 100%;
        }
        .modal-image-container {
            flex: 1.2;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            overflow: hidden;
            min-height: 350px;
        }
        .modal-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-info-container {
            flex: 1;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .modal-day-badge {
            background: var(--accent-3);
            color: #000;
            font-weight: 900;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
        }
        .modal-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: white;
            line-height: 1.2;
        }
        .modal-date-text {
            font-size: 0.95rem;
            color: var(--accent-3);
            font-weight: 700;
            opacity: 0.9;
        }
        .modal-desc-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ccc;
            margin-top: 10px;
        }
        
        /* Adattabilità Mobile */
        @media (max-width: 768px) {
            .modal-body {
                flex-direction: column;
            }
            .modal-image-container {
                border-top-left-radius: 20px;
                border-top-right-radius: 20px;
                border-bottom-left-radius: 0;
                min-height: 250px;
                flex: none;
            }
            .modal-info-container {
                padding: 25px 20px;
                flex: none;
            }
            .modal-content {
                max-height: 90vh;
            }
            .modal-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-controls">
            <a href="index.htm" class="home-btn" title="Home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </a>
            <button class="map-switch-btn" id="open-calendar" title="Calendario" style="display: flex; align-items: center; padding: 8px 12px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </button>
            <button class="map-switch-btn" id="show-vessel">Vessel</button>
            <button class="map-switch-btn" id="show-marine">Marine</button>
        </div>
        <div class="map-wrapper">
            <div id="osm-map"></div>
            <div id="vessel-map-container"></div>
            <div id="marine-map-container"></div>
            <div id="calendar-view">
                <div class="calendar-container">
                    <div id="calendar-content"></div>
                </div>
            </div>

            <!-- Modal per Dettaglio Giorno Calendario -->
            <div id="calendar-modal" class="modal-overlay">
                <div class="modal-content">
                    <span class="modal-close-btn">&times;</span>
                    <div class="modal-body">
                        <div class="modal-image-container">
                            <img id="modal-img" src="" alt="Dettaglio Giorno">
                        </div>
                        <div class="modal-info-container">
                            <div class="modal-header">
                                <span id="modal-day-num" class="modal-day-badge"></span>
                                <h2 id="modal-title"></h2>
                            </div>
                            <div id="modal-date" class="modal-date-text"></div>
                            <p id="modal-desc" class="modal-desc-text"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="map-controls-top-right" id="map-overlays">
                <button id="center-map-btn" class="map-control-btn">Centra Mappa</button>
                <button id="center-ship-btn" class="map-control-btn" style="display: none;">Centra Nave</button>
            </div>
        </div>
    </header>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function toggleExpand(el) {
            el.classList.toggle('expanded');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();

            // --- CONFIGURAZIONE POSIZIONE REALE ---
            // Se vuoi forzare la posizione della nave (es. presa da MarineTraffic), 
            // inserisci le coordinate qui [lat, lon]. Se null, usa l'itinerario.
            const manualAISPosition = null;
            let shipMarker;

            // Configurazione Mappa Interattiva (OpenStreetMap)
            const osmMap = L.map('osm-map', {
                zoomControl: true,
                attributionControl: false
            }).setView([40.0, 0.0], 5);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 18
            }).addTo(osmMap);

            // Forza il ricalcolo delle dimensioni per evitare che la mappa appaia grigia o invisibile
            setTimeout(() => { osmMap.invalidateSize(); }, 100);

            const cruiseDestinations = [
                { id: "hamburg-1", name: "Amburgo", coords: [53.550, 10.000], date: "22 Luglio 2026", info: "Giorno d'imbarco, Partenza 20:00" },
                { id: "navigazione-1", name: "In Navigazione", coords: [56.0, 7.0], date: "23 Luglio 2026", info: "Immergiti nella vita di bordo..." },
                { id: "maloy", name: "Maloy", coords: [61.936, 5.131], date: "24 Luglio 2026", info: "Arrivo 13:30 / Partenza 20:00" },
                { id: "navigazione-2", name: "In Navigazione", coords: [65.0, 9.0], date: "25 Luglio 2026", info: "Immergiti nella vita di bordo..." },
                { id: "leknes", name: "Leknes | Isole Lofoten", coords: [68.1475, 13.6115], date: "26 Luglio 2026", info: "Arrivo 08:00 / Partenza 18:00" },
                { id: "tromso", name: "Tromso", coords: [69.6517, 18.9556], date: "27 Luglio 2026", info: "Arrivo 09:00 / Partenza 18:00" },
                { id: "honningsvag", name: "Honningsvag | Capo Nord", coords: [70.97861, 25.97667], date: "28 Luglio 2026", info: "Arrivo 08:00 / Partenza 18:00" },
                { id: "navigazione-3", name: "In Navigazione", coords: [67.0, 11.0], date: "29 Luglio 2026", info: "Immergiti nella vita di bordo..." },
                { id: "trondheim", name: "Trondheim", coords: [63.42972, 10.39333], date: "30 Luglio 2026", info: "Arrivo 12:00 / Partenza 20:00" },
                { id: "alesund", name: "Alesund", coords: [62.47226, 6.1549], date: "31 Luglio 2026", info: "Arrivo 08:00 / Partenza 18:00" },
                { id: "vik-sogn", name: "VIK-SOGN", coords: [61.08708, 6.57914], date: "01 Agosto 2026", info: "Arrivo 09:00 / Partenza 17:00" },
                { id: "navigazione-4", name: "In Navigazione", coords: [58.0, 5.0], date: "02 Agosto 2026", info: "Immergiti nella vita di bordo..." },
                { id: "hamburg-2", name: "Amburgo", coords: [53.550, 10.000], date: "03 Agosto 2026", info: "Giorno di sbarco, Arrivo 08:00" }
            ];

            // Mapping date -> ID per animazione pulsante
            const cruiseSchedule = {
                "2026-07-22": "hamburg-1",
                "2026-07-23": "navigazione-1",
                "2026-07-24": "maloy",
                "2026-07-25": "navigazione-2",
                "2026-07-26": "leknes",
                "2026-07-27": "tromso",
                "2026-07-28": "honningsvag",
                "2026-07-29": "navigazione-3",
                "2026-07-30": "trondheim",
                "2026-07-31": "alesund",
                "2026-08-01": "vik-sogn",
                "2026-08-02": "navigazione-4",
                "2026-08-03": "hamburg-2"
            };
            
            const todayKey = now.getFullYear() + '-' + 
                             String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                             String(now.getDate()).padStart(2, '0');
            const activeId = cruiseSchedule[todayKey];
            const scheduleKeys = Object.keys(cruiseSchedule);
            const activeIndex = scheduleKeys.indexOf(todayKey);
            
            // Funzione per generare una curva fluida tra punti (Catmull-Rom Spline)
            const getCurvedPath = (points, tension = 0.3, segments = 15) => {
                if (points.length < 3) return points;
                const curvedPoints = [];
                for (let i = 0; i < points.length - 1; i++) {
                    const p0 = (i === 0) ? points[i] : points[i - 1];
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const p3 = (i + 2 >= points.length) ? p2 : points[i + 2];
                    for (let t = 0; t < segments; t++) {
                        const t1 = t / segments;
                        const t2 = t1 * t1;
                        const t3 = t2 * t1;
                        const f1 = -tension * t3 + 2 * tension * t2 - tension * t1;
                        const f2 = (2 - tension) * t3 + (tension - 3) * t2 + 1;
                        const f3 = (tension - 2) * t3 + (3 - 2 * tension) * t2 + tension * t1;
                        const f4 = tension * t3 - tension * t2;
                        curvedPoints.push([
                            p0[0] * f1 + p1[0] * f2 + p2[0] * f3 + p3[0] * f4,
                            p0[1] * f1 + p1[1] * f2 + p2[1] * f3 + p3[1] * f4
                        ]);
                    }
                }
                curvedPoints.push(points[points.length - 1]);
                return curvedPoints;
            };

            let activeCoords = null;
            const todayDest = cruiseDestinations.find(d => d.id === activeId);
            if (todayDest) activeCoords = todayDest.coords;

            const shipFinalPos = manualAISPosition || activeCoords;

            // Definizione dei segmenti della rotta con waypoint nautici per evitare la terraferma
            // Nuovi segmenti di percorso per la crociera in Norvegia
            const cruisePathSegments = [
                // Giorno 1: Amburgo -> Giorno 2: In Navigazione (verso Maloy)
                [[53.550, 10.000], [53.56, 9.60], [53.92, 8.70], [54.20, 8.20], [56.0, 7.0]],
                // Giorno 2: In Navigazione -> Giorno 3: Maloy
                [[56.0, 7.0], [58.0, 4.5], [60.0, 4.0], [61.80, 4.5], [61.936, 5.131]],
                // Giorno 3: Maloy -> Giorno 4: In Navigazione (verso Leknes)
                [[61.936, 5.131], [62.20, 4.80], [64.00, 7.50], [65.0, 9.0]],
                // Giorno 4: In Navigazione -> Giorno 5: Leknes
                [[65.0, 9.0], [67.0, 11.50], [67.80, 12.80], [68.1475, 13.6115]],
                // Giorno 5: Leknes -> Giorno 6: Tromso
                [[68.1475, 13.6115], [68.35, 14.50], [69.40, 17.50], [69.6517, 18.9556]],
                // Giorno 6: Tromso -> Giorno 7: Honningsvag
                [[69.6517, 18.9556], [70.20, 19.50], [70.80, 23.50], [70.97861, 25.97667]],
                // Giorno 7: Honningsvag -> Giorno 8: In Navigazione (verso Trondheim)
                [[70.97861, 25.97667], [71.20, 25.00], [69.0, 16.0], [67.0, 11.0]],
                // Giorno 8: In Navigazione -> Giorno 9: Trondheim
                [[67.0, 11.0], [65.0, 11.50], [63.60, 9.50], [63.42972, 10.39333]],
                // Giorno 9: Trondheim -> Giorno 10: Alesund
                [[63.42972, 10.39333], [63.50, 9.00], [62.80, 6.50], [62.47226, 6.1549]],
                // Giorno 10: Alesund -> Giorno 11: VIK-SOGN
                [[62.47226, 6.1549], [61.50, 4.80], [61.10, 5.00], [61.10, 6.00], [61.08708, 6.57914]],
                // Giorno 11: VIK-SOGN -> Giorno 12: In Navigazione (verso Amburgo)
                [[61.08708, 6.57914], [61.10, 5.00], [59.5, 4.0], [58.0, 5.0]],
                // Giorno 12: In Navigazione -> Giorno 13: Amburgo
                [[58.0, 5.0], [55.0, 7.5], [54.00, 8.50], [53.90, 8.80], [53.56, 9.60], [53.550, 10.000]]
            ];

            for (let i = 0; i < cruisePathSegments.length; i++) {
                const isPast = activeIndex !== -1 && i < activeIndex;
                const segmentColor = isPast ? '#4f46e5' : '#06b6d4';
                const segmentOpacity = isPast ? 0.8 : 0.4;
                const segmentDash = isPast ? '' : '5, 10';
                
                const poly = L.polyline(getCurvedPath(cruisePathSegments[i]), {
                    color: segmentColor,
                    weight: 4,
                    opacity: segmentOpacity,
                    dashArray: segmentDash
                }).addTo(osmMap);
            }

            const usedPositions = [];

            cruiseDestinations.forEach((dest, index) => {                
                const dayNum = index + 1; // Simply use index + 1 for day number
                // Gestione sovrapposizioni: calcola offset se la posizione è già occupata
                let displayCoords = [dest.coords[0], dest.coords[1]];
                let foundCollision = true;
                while (foundCollision) {
                    foundCollision = usedPositions.some(pos => 
                        Math.abs(pos[0] - displayCoords[0]) < 0.03 && 
                        Math.abs(pos[1] - displayCoords[1]) < 0.03
                    );
                    if (foundCollision) {
                        displayCoords[0] += 0.04; // Offset ridotto per rendere i punti vicinissimi
                        displayCoords[1] += 0.04;
                    }
                }
                usedPositions.push([...displayCoords]);

                const popupHtml = `
                    <div class="popup-card">
                        <div class="popup-info">
                            <h3>Giorno ${dayNum}: ${dest.name}</h3>
                            <p><strong>${dest.date}</strong></p>
                            <p>${dest.info}</p>
                        </div>
                    </div>
                `;

                // Il numero cerchiato diventa il marker principale e cliccabile
                const marker = L.marker(displayCoords, {
                    icon: L.divIcon({
                        className: 'marker-label',
                        html: `<span>${dayNum}</span>`,
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    })
                }).bindPopup(popupHtml, {
                    maxWidth: 220,
                    className: 'custom-cruise-popup'
                }).addTo(osmMap);
            });

            // Disegna l'icona della nave (segnalino rosso) sulla posizione corretta
            const shipIcon = L.divIcon({
                className: 'ship-marker-container',
                html: `
                    <svg viewBox="0 0 24 24" width="30" height="30" style="filter: drop-shadow(0 0 3px rgba(0,0,0,0.5));">
                        <path fill="#ef4444" d="M12,2C8.13,2,5,5.13,5,9c0,5.25,7,13,7,13s7-7.75,7-13C19,5.13,15.87,2,12,2z M12,11.5c-1.38,0-2.5-1.12-2.5-2.5s1.12-2.5,2.5-2.5s2.5,1.12,2.5,2.5S13.38,11.5,12,11.5z"/>
                    </svg>
                `,
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });

            // Inizializza il marker se abbiamo una posizione predefinita
            if (shipFinalPos) {
                shipMarker = L.marker(shipFinalPos, { icon: shipIcon, zIndexOffset: 5000 })
                    .addTo(osmMap);
            }

            // --- INTEGRAZIONE POSIZIONE LIVE ---
            function timeAgo(date) {
                if (!date) return "N/D";
                const seconds = Math.floor((new Date() - new Date(date)) / 1000);
                if (seconds < 60) return "Adesso";
                const minutes = Math.floor(seconds / 60);
                if (minutes < 60) return `${minutes} min fa`;
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return `${hours} ore fa`;
                return new Date(date).toLocaleDateString('it-IT');
            }

            function updateLivePosition() {
                fetch('position.json', { cache: "no-store" })
                    .then(response => {
                        if (!response.ok) throw new Error("File non trovato");
                        return response.json();
                    })
                    .then(data => {
                        if (data.lat && data.lon && data.lat !== 0 && data.lon !== 0) {
                            const livePos = [data.lat, data.lon];
                            
                            // Formattazione popup con timestamp
                            const updateTime = data.timestamp ? timeAgo(data.timestamp) : "Recentemente";
                            const popupContent = `
                                <div class="popup-card">
                                    <div class="popup-info">
                                        <h3>La mia posizione</h3>
                                        <p>Aggiornato: <strong>${updateTime}</strong></p>
                                        <p><small>${data.lat.toFixed(4)}, ${data.lon.toFixed(4)}</small></p>
                                    </div>
                                </div>
                            `;

                            if (!shipMarker) {
                                shipMarker = L.marker(livePos, { icon: shipIcon, zIndexOffset: 5000 })
                                    .addTo(osmMap);
                            } else {
                                shipMarker.setLatLng(livePos);
                            }
                            
                            shipMarker.bindPopup(popupContent, { maxWidth: 200 });

                            // Mostra il pulsante per centrare sulla nave se esiste la posizione
                            const centerShipBtn = document.getElementById('center-ship-btn');
                            if (centerShipBtn) {
                                centerShipBtn.style.display = 'block';
                            }

                            console.log("Posizione aggiornata da position.json:", livePos);
                        }
                    })
                    .catch(err => console.warn("Errore caricamento posizione live:", err.message));
            }

            updateLivePosition();
            setInterval(updateLivePosition, 60000); // Controlla ogni minuto

            // --- PERCORSO AUTOSTRADALE FORLÌ -> AMBURGO (via Monaco di Baviera) ---
            // Waypoint che ricalcano il tracciato autostradale reale:
            // A14 Forlì-Bologna, A22 del Brennero (Modena-Verona-Trento-Bolzano-Brennero),
            // A13/A12 austriache (Innsbruck-Kufstein), A8/A99 tedesche fino a Monaco,
            // A9 Monaco-Norimberga-Halle, A2 Halle-Hannover, A7 Hannover-Amburgo.
            const highwayRoute = [
                [44.222, 12.041],  // Forlì
                [44.494, 11.342],  // Bologna (A14)
                [44.646, 10.925],  // Modena (A1 -> innesto A22)
                [45.157, 10.792],  // Mantova (A22)
                [45.438, 10.993],  // Verona (A22)
                [46.068, 11.121],  // Trento (A22)
                [46.498, 11.354],  // Bolzano (A22)
                [47.002, 11.507],  // Passo del Brennero
                [47.269, 11.404],  // Innsbruck (A13)
                [47.583, 12.167],  // Kufstein (A12)
                [48.137, 11.576],  // Monaco di Baviera (A8/A99)
                [49.452, 11.077],  // Norimberga (A9)
                [51.482, 11.969],  // Halle (A9)
                [52.375, 9.732],   // Hannover (A2)
                [53.551, 9.993]    // Amburgo (A7)
            ];

            const highwayPoly = L.polyline(highwayRoute, {
                color: '#f97316',
                weight: 4,
                opacity: 0.9
            }).addTo(osmMap);

            const highwayStartIcon = L.divIcon({
                className: 'marker-label',
                html: `<span>F</span>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            const highwayWaypointIcon = L.divIcon({
                className: 'marker-label',
                html: `<span>M</span>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            L.marker([44.222, 12.041], { icon: highwayStartIcon })
                .bindPopup(`
                    <div class="popup-card">
                        <div class="popup-info">
                            <h3>Forlì</h3>
                            <p>Partenza del percorso autostradale</p>
                        </div>
                    </div>
                `, { maxWidth: 220, className: 'custom-cruise-popup' })
                .addTo(osmMap);

            L.marker([48.137, 11.576], { icon: highwayWaypointIcon })
                .bindPopup(`
                    <div class="popup-card">
                        <div class="popup-info">
                            <h3>Monaco di Baviera</h3>
                            <p>Tappa intermedia sulla A9/A8</p>
                        </div>
                    </div>
                `, { maxWidth: 220, className: 'custom-cruise-popup' })
                .addTo(osmMap);

            // Centra la mappa sull'itinerario all'avvio
            const itineraryBounds = L.latLngBounds(cruiseDestinations.map(d => d.coords));
            osmMap.fitBounds(itineraryBounds, { padding: [50, 50] });

            // GESTIONE SWITCH MAPPE
            const osmEl = document.getElementById('osm-map');
            const vesselContainer = document.getElementById('vessel-map-container');
            const marineContainer = document.getElementById('marine-map-container');
            const centerBtn = document.getElementById('center-map-btn');
            const mapOverlays = document.getElementById('map-overlays');

            const switchBtns = document.querySelectorAll('.map-switch-btn');
            const calendarView = document.getElementById('calendar-view');

            const hideAll = () => {
                [osmEl, vesselContainer, marineContainer, calendarView].forEach(el => el.style.display = 'none');
                mapOverlays.style.display = 'none';
                switchBtns.forEach(btn => btn.classList.remove('active'));
            };

            // Gestione Calendario
            document.getElementById('open-calendar').addEventListener('click', () => {
                hideAll();
                renderCalendar();
                calendarView.style.display = 'block';
            });

            const cruiseDescriptions = {
                "2026-07-22": "Amburgo è una città ricca di fascino, famosa per la Speicherstadt (il quartiere dei magazzini in mattoni rossi patrimonio UNESCO) e la maestosa Elbphilharmonie. Partenza alle ore 20:00 per l'inizio dell'avventura.",
                "2026-07-23": "Giornata in navigazione. Approfitta dei comfort di bordo di Costa Favolosa, rilassati nelle piscine, goditi la cucina di alto livello ed esplora le attività di intrattenimento offerte dal personale di bordo.",
                "2026-07-24": "Un autentico e pittoresco villaggio di pescatori. Da non perdere la celebre formazione rocciosa di Kannesteinen, scolpita dall'oceano a forma di fungo, il faro di Hendanes a picco sulle scogliere e la splendida spiaggia di sabbia chiara di Refvik.",
                "2026-07-25": "Giornata in navigazione. Rilassati mentre la nave solca le acque del Mare del Nord verso il Circolo Polare Artico. Goditi la vista panoramica dell'oceano e la vita a bordo.",
                "2026-07-26": "Una delle destinazioni più spettacolari al mondo, caratterizzata da maestose montagne granitiche che si gettano a picco nel mare, spiagge di sabbia bianca lambite da acque cristalline come Haukland e i caratteristici villaggi di pescatori con le tipiche rorbuer rosse.",
                "2026-07-27": "Conosciuta come la 'Porta dell'Artico', Tromsø è circondata da maestosi fiordi e montagne. Visita la celebre Cattedrale Artica con le sue grandi vetrate, sali con la funivia Fjellheisen per una vista panoramica mozzafiato o esplora i musei dedicati alle spedizioni polari.",
                "2026-07-28": "Il punto d'accesso al mitico promontorio di Capo Nord (Nordkapp), una maestosa falesia a picco sul Mar Glaciale Artico situata a 71°10'21\" N. Qui potrai vivere l'emozione unica e indimenticabile di trovarti 'alla fine del mondo'.",
                "2026-07-29": "Giornata in navigazione. Inizia la rotta di discesa verso sud lungo la spettacolare costa della Norvegia. Ammira i panorami dei fiordi e delle isole dal ponte della nave in totale relax.",
                "2026-07-30": "Antica capitale norvegese ricca di storia e fascino. Ammira la cattedrale gotica di Nidaros (sito di incoronazione dei re norvegesi), passeggia tra le tipiche case in legno colorato del quartiere storico di Bakklandet e attraversa il ponte Gamle Bybro.",
                "2026-07-31": "Famosa in tutto il mondo per la sua splendida architettura in stile Art Nouveau (Jugendstil), nata dalla ricostruzione dopo il grande incendio del 1904. Sali i 418 gradini del monte Aksla per godere di un panorama spettacolare sulla città e sulle isole circostanti.",
                "2026-08-01": "Situata sulle sponde del maestoso Sognefjord, il fiordo più lungo e profondo della Norvegia. Vik ospita la celebre Hopperstad Stavkirke, una delle più antiche e affascinanti chiese in legno medievali giunte fino a noi, risalente al 1130.",
                "2026-08-02": "Giornata in navigazione. Ultimo giorno in mare mentre la nave fa rotta di rientro verso la Germania. È il momento ideale per rilassarsi alla SPA di bordo, fare gli ultimi acquisti ed ammirare il tramonto sul mare.",
                "2026-08-03": "Si conclude ad Amburgo questo straordinario viaggio tra i fiordi norvegesi e il Capo Nord. Tempo per un ultimo saluto a Costa Favolosa o per una visita della vivace città anseatica prima del rientro."
            };

            function formatItineraryDate(dateStr) {
                const parts = dateStr.split('-');
                if (parts.length !== 3) return dateStr;
                const year = parts[0];
                const monthIndex = parseInt(parts[1]) - 1;
                const day = parseInt(parts[2]);
                
                const months = [
                    "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno",
                    "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"
                ];
                
                return `${day} ${months[monthIndex]} ${year}`;
            }

            window.openDayDetail = function(dateStr, dayName, dayNum, destName) {
                const modal = document.getElementById('calendar-modal');
                const modalImg = document.getElementById('modal-img');
                const modalDayNum = document.getElementById('modal-day-num');
                const modalTitle = document.getElementById('modal-title');
                const modalDate = document.getElementById('modal-date');
                const modalDesc = document.getElementById('modal-desc');

                if (!modal) return;

                modalImg.src = `${dateStr}.jpg`;
                modalImg.onerror = function() {
                    this.src = '1.jpg';
                };

                modalDayNum.textContent = dayName;
                modalTitle.textContent = destName || "In Navigazione";
                modalDate.textContent = formatItineraryDate(dateStr);
                modalDesc.textContent = cruiseDescriptions[dateStr] || "Immergiti nella vita di bordo...";

                modal.style.display = 'flex';
                setTimeout(() => {
                    modal.classList.add('open');
                }, 10);
            };

            window.closeDayDetail = function() {
                const modal = document.getElementById('calendar-modal');
                if (!modal) return;
                modal.classList.remove('open');
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 300);
            };

            const modal = document.getElementById('calendar-modal');
            const closeBtn = document.querySelector('.modal-close-btn');
            if (closeBtn) {
                closeBtn.addEventListener('click', window.closeDayDetail);
            }
            if (modal) {
                modal.addEventListener('click', () => {
                    window.closeDayDetail();
                });
            }

            function renderCalendar() {
                const content = document.getElementById('calendar-content');
                const today = new Date();
                let html = `
                    <h1 style="text-align:center; color:var(--accent-3); margin-bottom:20px; font-weight:900; text-transform:uppercase; letter-spacing:3px;">Itinerario 2026</h1>
                    <div class="calendar-banner-container">
                        <img src="itinerario.jpg" alt="Mappa Itinerario" class="calendar-banner-img">
                    </div>
                    <div class="calendar-grid">`;
                
                const start = new Date(2026, 6, 22);
                const end = new Date(2026, 7, 3);
                
                for (let d = new Date(start); d.getTime() <= end.getTime(); d.setDate(d.getDate() + 1)) {
                    const dateStr = d.getFullYear() + '-' + 
                                     String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                                     String(d.getDate()).padStart(2, '0');
                    const dateObj = new Date(d);
                    const isCruise = cruiseSchedule[dateStr];
                    const isToday = dateStr === todayKey;
                    const isPast = dateObj < today && !isToday;
                    
                    const dayName = d.toLocaleDateString('it-IT', { weekday: 'short' }).toUpperCase().replace('.', '');
                    const dayNum = d.getDate();

                    let destName = '';
                    let plainDestName = '';
                    if (isCruise) {
                        const dest = cruiseDestinations.find(d => d.id === isCruise);
                        if (dest) {
                            destName = `<div class="calendar-dest">${dest.name}</div>`;
                            plainDestName = dest.name;
                        }
                    }
                    
                    html += `
                        <div class="calendar-day ${isCruise ? 'cruise' : ''} ${isToday ? 'today' : ''} ${isPast ? 'past' : ''}" 
                             style="background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('${dateStr}.jpg'), url('1.jpg')" 
                             onclick="openDayDetail('${dateStr}', '${dayName} ${dayNum}', ${dayNum}, '${plainDestName.replace(/'/g, "\\'")}')">
                            <span class="day-num">${dayName} ${dayNum}</span>
                            ${destName}
                        </div>`;
                }
                html += '</div>';
                content.innerHTML = html;
            }

            document.getElementById('show-vessel').addEventListener('click', function() {
                hideAll();
                this.classList.add('active');
                vesselContainer.style.display = 'block';
                vesselContainer.innerHTML = `<iframe src="https://www.vesselfinder.com/aismap?imo=9479852&zoom=10" style="width:100%; height:100%; border:none;"></iframe>`;
            });

            document.getElementById('show-marine').addEventListener('click', function() {
                hideAll();
                this.classList.add('active');
                marineContainer.style.display = 'block';
                marineContainer.innerHTML = `<iframe src="https://www.marinetraffic.com/en/ais/embed/shipid:281385/zoom:14" style="width:100%; height:100%; border:none;"></iframe>`;
            });

            centerBtn.addEventListener('click', () => {
                osmMap.flyToBounds(itineraryBounds, { animate: true, duration: 1.5, padding: [50, 50] });
            });

            const centerShipBtn = document.getElementById('center-ship-btn');
            if (centerShipBtn) {
                centerShipBtn.addEventListener('click', () => {
                    if (shipMarker) {
                        osmMap.flyTo(shipMarker.getLatLng(), 10, { animate: true, duration: 1.5 });
                    }
                });
            }
        });
    </script>
</body>
</html>
