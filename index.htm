<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ora e Data Moderna</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 100;
        }
        .site-title {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <header class="top-bar">
        <div class="site-title">iginoc</div>
        <div class="clock-card" style="padding: 10px 20px; min-width: auto;">
            <h1 id="time" class="time-display" style="font-size: 1.5rem; margin: 0;">00:00:00</h1>
            <p id="date" class="date-display" style="font-size: 0.8rem; margin: 0;">Caricamento data...</p>
        </div>
    </header>

    <main style="padding: 20px; margin-top: 120px; position: relative; z-index: 10;">
        <div id="map-container" style="border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); background: rgba(255,255,255,0.1); backdrop-filter: blur(5px);">
            <script type="text/javascript">
                // Map appearance
                var width="100%";         // width in pixels or percentage
                var height="300";         // height in pixels
                var names=false;           // always show ship names (defaults to false)

                // Single ship tracking
                var imo="9479852";        // display latest position (by IMO, overrides MMSI)
                var show_track=true;      // display track line (last 24 hours)
            </script>
            <script type="text/javascript" src="https://www.vesselfinder.com/aismap.js"></script>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
