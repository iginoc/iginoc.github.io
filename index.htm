<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerario di Viaggio</title>
    <link rel="icon" type="image/jpeg" href="1.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html {
            scroll-behavior: smooth;
        }
        body { /* Ensure body has no extra margins/paddings */
            margin: 0; 
            padding: 0; 
            min-height: 100vh; /* Ensure body takes full viewport height */
        }
        .diary-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 100px;
        }
        .day-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 2.5rem;
            margin-bottom: 3rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            scroll-margin-top: calc(var(--header-height, 600px) + 20px);
        }
        @media (max-width: 600px) {
            .day-card { padding: 1.5rem; }
        }
        .day-header {
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }
        .day-city { font-size: 1.8rem; color: var(--accent-3); margin-bottom: 0.2rem; font-weight: 700; }
        .day-info { font-size: 1.1rem; color: var(--accent-2); margin-bottom: 1.5rem; font-weight: 600; }
        .day-text { line-height: 1.8; color: rgba(255,255,255,0.8); margin-bottom: 1.2rem; font-size: 1.05rem; }

        /* Stili per la mappa interattiva */
        .map-container {
            position: relative;
            width: 95%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0;
            transition: all 0.4s ease-in-out;
            max-height: 800px; /* Aumentato per mostrare l'intera mappa su desktop */
            overflow: hidden;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .map-wrapper {
            position: relative;
            width: 95%;
            max-width: 900px;
            margin: 0 auto 15px;
        }
        #osm-map {
            width: 100%;
            height: 350px;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .map-control-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--accent-3);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .map-control-btn:hover {
            background: var(--accent-3);
            color: white;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }
        .current-date-display {
            background: rgba(5, 5, 5, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-3);
            z-index: 25;
            text-transform: capitalize;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            margin: 0 auto 15px;
            width: fit-content;
            text-align: center;
            align-items: center;
        }
        .countdown-timer {
            font-size: 0.65rem;
            color: var(--accent-2);
            margin-top: 3px;
        }

        /* Personalizzazione Popup Leaflet */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 15, 15, 0.85) !important;
            color: white !important;
            border-radius: 1.5rem !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 0;
            overflow: hidden;
        }
        .leaflet-popup-content { margin: 0 !important; width: 220px !important; }
        .leaflet-popup-tip { background: rgba(15, 15, 15, 0.85) !important; }
        
        .popup-card { display: flex; flex-direction: column; }
        .popup-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-bottom: 2px solid var(--accent-3);
        }
        .popup-info { padding: 15px; }
        .popup-info h3 { margin: 0 0 5px; font-size: 1.1rem; color: var(--accent-3); }
        .popup-info p { margin: 0; font-size: 0.85rem; opacity: 0.9; line-height: 1.4; }
        .popup-btn {
            display: block;
            margin-top: 10px;
            color: var(--accent-3);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* Animazione Pulsante per la tappa odierna */
        .pulse-container {
            width: 12px;
            height: 12px;
            background: var(--accent-3);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 10px var(--accent-3);
        }
        .pulse-container::after {
            content: '';
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
            position: absolute;
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(4); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header>
        <div class="current-date-display">
            <span id="date-text"></span>
            <span id="countdown-text" class="countdown-timer"></span>
        </div>
        <div class="map-wrapper">
            <div id="osm-map"></div>
            <button id="center-map-btn" class="map-control-btn">Centra Mappa</button>
        </div>
    </header>

    <main style="margin-top: 20px; position: relative; z-index: 10;">
        <div style="max-width: 900px; margin: 0 auto; padding: 0 20px;">
            <div class="day-card" style="padding: 0; overflow: hidden; height: 500px;">
                <script type="text/javascript">
                    // Map appearance
                    var width="100%";         // width in pixels or percentage
                    var height="100%";        // height in pixels or percentage
                    var latitude="40.00";     // center latitude (decimal degrees)
                    var longitude="0";    // center longitude (decimal degrees) 
                    var zoom="4";
                    var names=false;           // always show ship names (defaults to false)

                    // Single ship tracking
                    var imo="9479852";        // display latest position (by IMO, overrides MMSI)
                    var show_track=true;      // display track line (last 24 hours)
                </script>
                <script type="text/javascript" src="https://www.vesselfinder.com/aismap.js"></script>
            </div>

            <div class="day-card" style="padding: 0; overflow: hidden; height: 450px; margin-top: 2rem;">
                <script type="text/javascript">
                    width = '100%';
                    height = '450';
                    border = '0';
                    shownames = 'true';
                    latitude = '40.0';
                    longitude = '30.0';
                    zoom = '3';
                    maptype = '3';
                    trackvessel = '247311100';
                </script>
                <script type="text/javascript" src="https://www.marinetraffic.com/js/embed.js"></script>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateText = document.getElementById('date-text');
            const countdownText = document.getElementById('countdown-text');

            // Gestione Data Odierna
            const now = new Date();
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
            dateText.textContent = now.toLocaleDateString('it-IT', dateOptions);

            // Configurazione Mappa Interattiva (OpenStreetMap)
            const osmMap = L.map('osm-map', {
                zoomControl: true,
                attributionControl: false
            }).setView([40.0, 0.0], 5);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 18
            }).addTo(osmMap);

            const cruiseDestinations = [
                { id: "savona", name: "Savona", coords: [44.3129, 8.4764], img: "1.jpg", date: "02 Apr 2026", info: "Partenza 17:30" },
                { id: "marsiglia", name: "Marsiglia", coords: [43.2965, 5.3698], img: "1.jpg", date: "03 Apr 2026", info: "09:00 - 18:00" },
                { id: "day-3", name: "In Navigazione", coords: [41.5, 3.5], img: "1.jpg", date: "04 Apr 2026", info: "Mar Mediterraneo" },
                { id: "valencia", name: "Valencia", coords: [39.4699, -0.3763], img: "1.jpg", date: "05 Apr 2026", info: "08:00 - 18:00" },
                { id: "cartagena", name: "Cartagena", coords: [37.6051, -0.9862], img: "1.jpg", date: "06 Apr 2026", info: "08:00 - 18:00" },
                { id: "malaga", name: "Malaga", coords: [36.7213, -4.4214], img: "1.jpg", date: "07 Apr 2026", info: "08:00 - 18:00" },
                { id: "cadice", name: "Cadice", coords: [36.5298, -6.2947], img: "1.jpg", date: "08 Apr 2026", info: "07:00 - 16:00" },
                { id: "lisbona", name: "Lisbona", coords: [38.7223, -9.1393], img: "1.jpg", date: "09 Apr 2026", info: "08:00 - 16:00" },
                { id: "day-9", name: "In Navigazione", coords: [36.0, -5.6], img: "1.jpg", date: "10 Apr 2026", info: "Stretto di Gibilterra" },
                { id: "alicante", name: "Alicante", coords: [38.3452, -0.4810], img: "1.jpg", date: "11 Apr 2026", info: "09:30 - 16:30" },
                { id: "barcellona", name: "Barcellona", coords: [41.3851, 2.1734], img: "1.jpg", date: "12 Apr 2026", info: "07:00 - 13:00" },
                { id: "day-12", name: "Savona (Ritorno)", coords: [44.3129, 8.4764], img: "1.jpg", date: "13 Apr 2026", info: "Arrivo 09:00" }
            ];

            // Mapping date -> ID per animazione pulsante
            const cruiseSchedule = {
                "2026-04-02": "savona", "2026-04-03": "marsiglia", "2026-04-04": "day-3",
                "2026-04-05": "valencia", "2026-04-06": "cartagena", "2026-04-07": "malaga",
                "2026-04-08": "cadice", "2026-04-09": "lisbona", "2026-04-10": "day-9",
                "2026-04-11": "alicante", "2026-04-12": "barcellona", "2026-04-13": "day-12"
            };
            
            const todayKey = now.toISOString().split('T')[0];
            const activeId = cruiseSchedule[todayKey];
            let activeCoords = null;

            const pathCoords = cruiseDestinations.map(d => d.coords);
            L.polyline(pathCoords, { color: '#06b6d4', weight: 3, opacity: 0.5, dashArray: '5, 10' }).addTo(osmMap);

            cruiseDestinations.forEach((dest, index) => {
                const popupHtml = `
                    <div class="popup-card">
                        <div class="popup-info">
                            <h3>Giorno ${index + 1}: ${dest.name}</h3>
                            <p><strong>${dest.date}</strong></p>
                            <p>${dest.info}</p>
                        </div>
                    </div>
                `;

                // Aggiungi effetto pulse se è la tappa di oggi
                if (dest.id === activeId) {
                    activeCoords = dest.coords;
                    L.marker(dest.coords, {
                        icon: L.divIcon({
                            className: '',
                            html: '<div class="pulse-container"></div>',
                            iconSize: [12, 12],
                            iconAnchor: [6, 6]
                        }),
                        interactive: false
                    }).addTo(osmMap);
                }

                L.circleMarker(dest.coords, {
                    radius: 6,
                    fillColor: "#06b6d4",
                    color: "#fff",
                    weight: 2,
                    fillOpacity: 1
                }).addTo(osmMap).bindPopup(popupHtml, {
                    maxWidth: 220,
                    className: 'custom-cruise-popup'
                });
            });

            osmMap.fitBounds(L.polyline(pathCoords).getBounds(), { padding: [30, 30] });

            const centerBtn = document.getElementById('center-map-btn');
            if (activeCoords) {
                centerBtn.addEventListener('click', () => {
                    osmMap.flyTo(activeCoords, 10, { animate: true, duration: 1.5 });
                });
            } else {
                centerBtn.style.display = 'none';
            }

            // Countdown alla partenza (2 Aprile 2026)
            const startDate = new Date("2026-04-02");
            const diffTime = startDate - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                countdownText.textContent = `Partenza tra ${diffDays} giorni`;
            } else if (diffDays === 0) {
                countdownText.textContent = "Si parte oggi! 🚢";
            } else if (now < new Date("2026-04-14")) {
                countdownText.textContent = "Crociera in corso";
            }
        });
    </script>
</body>
</html>
