<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerario di Viaggio - Costa Crociere</title>
    <link rel="icon" type="image/jpeg" href="1.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        header { height: 100vh; display: flex; flex-direction: column; }
        .map-wrapper { flex: 1; position: relative; width: 100%; }
        #osm-map { width: 100%; height: 100%; }
        #vessel-map-container, #marine-map-container { display: none; width: 100%; height: 100%; }
        .map-controls-top-right { position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .map-control-btn { background: #111; border: 1px solid #333; color: var(--accent-3); padding: 8px 16px; border-radius: 30px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
        .map-control-btn:hover { background: var(--accent-3); color: white; }
        .header-controls { background: #000; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; flex-wrap: wrap; border-bottom: 1px solid #222; }
        .map-switch-btn, .home-btn { background: #111; border: 1px solid #333; color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .map-switch-btn:hover, .home-btn:hover { background: #222; }
        .map-switch-btn.active { background: var(--accent-3); border-color: var(--accent-3); }
        .home-btn { text-decoration: none; }
        .leaflet-popup-content-wrapper { background: #111 !important; color: white !important; border-radius: 1rem !important; border: 1px solid #333; padding: 0; }
        .leaflet-popup-content { margin: 0 !important; width: 220px !important; }
        .leaflet-popup-tip { background: #111 !important; }
        .popup-card { display: flex; flex-direction: column; }
        .popup-info { padding: 15px; }
        .popup-info h3 { margin: 0 0 5px; font-size: 1.1rem; color: var(--accent-3); }
        .popup-info p { margin: 0; font-size: 0.85rem; opacity: 0.9; line-height: 1.4; }
        .ship-marker-container { display: flex; justify-content: center; align-items: center; }
        .marker-label { background: #111; border: 1px solid var(--accent-3); color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; cursor: pointer; transition: transform 0.2s; }
        .marker-label:hover { transform: scale(1.2); background: var(--accent-3); }
        #calendar-view { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; padding: 30px; overflow-y: auto; box-sizing: border-box; }
        .calendar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .calendar-day { background-size: cover; background-position: center; border: 1px solid #333; border-radius: 15px; padding: 25px 10px; text-align: center; display: flex; flex-direction: column; gap: 10px; min-height: 100px; transition: all 0.3s ease; cursor: pointer; }
        .calendar-day.cruise { border-color: var(--accent-3); border-width: 2px; }
        .calendar-day .day-num { font-size: 1.5rem; font-weight: 900; color: white; white-space: nowrap; }
        .calendar-dest { font-size: 0.75rem; color: var(--accent-3); font-weight: 700; text-transform: uppercase; line-height: 1.2; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); z-index: 3000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.open { display: flex; opacity: 1; }
        .modal-content { background: #111; border: 1px solid #333; border-radius: 20px; width: 90%; max-width: 900px; position: relative; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); }
        .modal-close-btn { position: absolute; top: 15px; right: 20px; color: #aaa; font-size: 2rem; font-weight: bold; cursor: pointer; z-index: 10; }
        .modal-body { display: flex; flex-direction: row; }
        .modal-image-container { flex: 1.2; background: #000; overflow: hidden; min-height: 350px; border-radius: 20px 0 0 20px; }
        .modal-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .modal-info-container { flex: 1; padding: 40px 30px; display: flex; flex-direction: column; justify-content: center; gap: 15px; }
        .modal-day-badge { background: var(--accent-3); color: #000; font-weight: 900; padding: 4px 10px; border-radius: 12px; text-transform: uppercase; font-size: 0.8rem; }
        .modal-title { font-size: 1.8rem; font-weight: 900; color: white; }
        .modal-date-text { color: var(--accent-3); font-weight: 700; }
        .modal-desc-text { line-height: 1.6; color: #ccc; }
        @media (max-width: 768px) { .modal-body { flex-direction: column; } .modal-image-container { border-radius: 20px 20px 0 0; min-height: 250px; } }
    </style>
</head>
<body>
    <header>
        <div class="header-controls">
            <a href="index.htm" class="home-btn" title="Home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </a>
            <button class="map-switch-btn" id="open-calendar" title="Calendario">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </button>
            <button class="map-switch-btn" id="open-link-modal" title="Cambia Vacanza">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
            </button>
            <button class="map-switch-btn" id="show-vessel">Vessel</button>
            <button class="map-switch-btn" id="show-marine">Marine</button>
        </div>
        <div class="map-wrapper">
            <div id="osm-map"></div>
            <div id="vessel-map-container"></div>
            <div id="marine-map-container"></div>
            <div id="calendar-view"><div class="calendar-container"><div id="calendar-content"></div></div></div>
            <div id="calendar-modal" class="modal-overlay">
                <div class="modal-content">
                    <span class="modal-close-btn" onclick="closeModals()">&times;</span>
                    <div class="modal-body">
                        <div class="modal-image-container"><img id="modal-img" src="" alt=""></div>
                        <div class="modal-info-container">
                            <span id="modal-day-num" class="modal-day-badge"></span>
                            <h2 id="modal-title" class="modal-title"></h2>
                            <div id="modal-date" class="modal-date-text"></div>
                            <p id="modal-desc" class="modal-desc-text"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div id="link-modal" class="modal-overlay">
                <div class="modal-content" style="max-width: 500px; padding: 30px;">
                    <span class="modal-close-btn" onclick="closeModals()">&times;</span>
                    <h2 style="color: var(--accent-3); margin-bottom: 20px;">Cambia Vacanza</h2>
                    <input type="text" id="cruise-link-input" placeholder="Incolla link Costa..." style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #000; color: white; margin-bottom: 20px;">
                    <div style="display: flex; gap: 10px;">
                        <button id="save-link-btn" class="map-control-btn" style="flex: 1;">Salva</button>
                        <button id="reset-link-btn" class="map-control-btn" style="flex: 1; background: #222;">Reset</button>
                    </div>
                </div>
            </div>
            <div class="map-controls-top-right"><button id="center-map-btn" class="map-control-btn">Centra</button></div>
        </div>
    </header>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBgAzFbZAU_OyEpTGCRqNpa7WXyTPeftbA",
            authDomain: "cruise-16a96.firebaseapp.com",
            databaseURL: "https://cruise-16a96-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "cruise-16a96",
            storageBucket: "cruise-16a96.firebasestorage.app",
            messagingSenderId: "930175030658",
            appId: "1:930175030658:web:f84de0ef791ccc1cb2eb9b"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const shipDatabase = {
            'FS': { name: 'Costa Fascinosa', imo: '9476939', mid: '422119' },
            'SM': { name: 'Costa Smeralda', imo: '9781889', mid: '5883230' },
            'TS': { name: 'Costa Toscana', imo: '9781891', mid: '6867332' },
            'PC': { name: 'Costa Pacifica', imo: '9378498', mid: '279923' },
            'DI': { name: 'Costa Diadema', imo: '9601132', mid: '712952' },
            'FA': { name: 'Costa Favolosa', imo: '9476927', mid: '422108' },
            'DE': { name: 'Costa Deliziosa', imo: '9398917', mid: '371746' },
            'FO': { name: 'Costa Fortuna', imo: '9237113', mid: '280031' },
            'SE': { name: 'Costa Serena', imo: '9344411', mid: '371727' }
        };

        const itineraries = {
            'PTP07A2L': 'cruise_data.json', // Caraibi
            'TCI07A51': 'canarie_data.json', // Canarie Smeralda
            'SAV': 'savona_data.json' // Placeholder per Savona
        };

        document.addEventListener('DOMContentLoaded', () => {
            const osmMap = L.map('osm-map').setView([0,0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(osmMap);
            let shipMarker = null, currentData = null;

            const render = (data) => {
                currentData = data;
                osmMap.eachLayer(l => { if(l instanceof L.Polyline || (l instanceof L.Marker && l !== shipMarker)) osmMap.removeLayer(l); });
                const dests = data.destinations || [];
                dests.forEach(d => {
                    L.marker(d.coords, { icon: L.divIcon({ className:'marker-label', html:`<span>${d.dayNum}</span>`, iconSize:[24,24]}) })
                     .bindPopup(`<h3>${d.name}</h3><p>${d.date}</p>`).addTo(osmMap);
                });
                (data.path_segments || []).forEach(s => L.polyline(getCurvedPath(s), {color:'#06b6d4', weight:4, opacity:0.6, dashArray:'5,10'}).addTo(osmMap));
                if(dests.length > 0) osmMap.fitBounds(L.latLngBounds(dests.map(d => d.coords)), {padding:[50,50]});
                renderCalendar(data);
            };

            const renderCalendar = (data) => {
                let html = `<h1 style="text-align:center; color:var(--accent-3);">${data.cruise_name}</h1><div class="calendar-grid">`;
                (data.destinations || []).forEach(d => {
                    html += `<div class="calendar-day cruise" style="background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('${d.image}'), url('1.jpg')" onclick="openDayDetail('${d.image}','Giorno ${d.dayNum}','${d.name}','${d.description}','${d.date}')"><span class="day-num">${d.dayNum}</span><div class="calendar-dest">${d.name}</div></div>`;
                });
                document.getElementById('calendar-content').innerHTML = html + '</div>';
            };

            window.openDayDetail = (i,h,t,d,z) => {
                document.getElementById('modal-img').src = i;
                document.getElementById('modal-day-num').textContent = h;
                document.getElementById('modal-title').textContent = t;
                document.getElementById('modal-desc').textContent = d;
                document.getElementById('modal-date').textContent = z;
                const m = document.getElementById('calendar-modal'); m.style.display='flex'; setTimeout(()=>m.classList.add('open'),10);
            };

            window.closeModals = () => { document.querySelectorAll('.modal-overlay').forEach(m=>{m.classList.remove('open'); setTimeout(()=>m.style.display='none',300);}); };

            database.ref('current_cruise').on('value', snap => {
                const val = snap.val();
                if(val && val.destinations) render(val);
                else fetch('cruise_data.json').then(r=>r.json()).then(render);
            });

            document.getElementById('save-link-btn').onclick = () => {
                const link = document.getElementById('cruise-link-input').value.trim();
                if(!link) return;

                // 1. Rileva Nave (cerca codici come /SM, /FS, /PC o il nome nel testo)
                let ship = shipDatabase['PC']; // Default Pacifica
                for (const k in shipDatabase) {
                    if (link.toUpperCase().includes('/' + k) || link.toUpperCase().includes(shipDatabase[k].name.toUpperCase().replace('COSTA ', ''))) {
                        ship = shipDatabase[k];
                        break;
                    }
                }

                // 2. Rileva Itinerario (cerca codici come TCI07A51, PTP07A2L)
                let itKey = 'DEFAULT';
                for (const k in itineraries) {
                    if (link.toUpperCase().includes(k.toUpperCase())) {
                        itKey = k;
                        break;
                    }
                }

                const dataUrl = itineraries[itKey] || 'cruise_data.json';
                console.log("Link inserito:", link);
                console.log("Nave rilevata:", ship.name, "Codice Itinerario:", itKey, "File dati:", dataUrl);

                fetch(dataUrl).then(r => r.json()).then(data => {
                    const finalData = {
                        ...data,
                        cruise_link: link,
                        ship_name: ship.name,
                        name: ship.name,
                        imo: ship.imo,
                        mid: ship.mid,
                        cruise_name: (itKey === 'DEFAULT') ?
                            (ship.name + " - Nuova Vacanza") :
                            data.cruise_name.replace(/Costa [a-zA-Z]+/i, ship.name),
                        updated_at: Date.now()
                    };

                    database.ref('current_cruise').set(finalData).then(() => {
                        alert("Vacanza aggiornata: " + ship.name + "\nItinerario: " + finalData.cruise_name);
                        closeModals();
                    });
                }).catch(err => {
                    alert("Errore caricamento dati itinerario: " + dataUrl);
                    console.error(err);
                });
            };

            document.getElementById('reset-link-btn').onclick = () => { database.ref('current_cruise').remove().then(()=> { alert("Reset effettuato!"); location.reload(); }); };
            document.getElementById('open-calendar').onclick = () => { hideAll(); document.getElementById('calendar-view').style.display='block'; };
            document.getElementById('open-link-modal').onclick = () => { document.getElementById('link-modal').style.display='flex'; setTimeout(()=>document.getElementById('link-modal').classList.add('open'),10); };
            document.getElementById('show-vessel').onclick = function() { hideAll(); this.classList.add('active'); const v=document.getElementById('vessel-map-container'); v.style.display='block'; v.innerHTML=`<iframe src="https://www.vesselfinder.com/aismap?imo=${currentData.imo}&zoom=10" style="width:100%; height:100%; border:none;"></iframe>`; };
            document.getElementById('show-marine').onclick = () => window.open(`https://www.marinetraffic.com/en/ais/home/shipid:${currentData.mid}`, '_blank');
            document.getElementById('center-map-btn').onclick = () => { if(currentData) osmMap.fitBounds(L.latLngBounds(currentData.destinations.map(d=>d.coords))); };

            function hideAll() { ['osm-map','vessel-map-container','marine-map-container','calendar-view'].forEach(id=>document.getElementById(id).style.display='none'); document.querySelectorAll('.map-switch-btn').forEach(b=>b.classList.remove('active')); }
            function getCurvedPath(p,t=0.3,s=15) { if(p.length<3) return p; const res=[]; for(let i=0;i<p.length-1;i++){ const p0=i==0?p[i]:p[i-1],p1=p[i],p2=p[i+1],p3=i+2>=p.length?p2:p[i+2]; for(let j=0;j<s;j++){ const k=j/s,k2=k*k,k3=k2*k; const f1=-t*k3+2*t*k2-t*k,f2=(2-t)*k3+(t-3)*k2+1,f3=(t-2)*k3+(3-2*t)*k2+t*k,f4=t*k3-t*k2; res.push([p0[0]*f1+p1[0]*f2+p2[0]*f3+p3[0]*f4,p0[1]*f1+p1[1]*f2+p2[1]*f3+p3[1]*f4]);}} res.push(p[p.length-1]); return res; }
        });
    </script>
</body>
</html>
