<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerario di Viaggio</title>
    <link rel="icon" type="image/jpeg" href="1.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .map-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
        }
        #osm-map {
            width: 100%;
            height: 100%;
        }
        #vessel-map-container, #marine-map-container {
            display: none;
            width: 100%;
            height: 100%;
        }
        .map-controls-top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .map-control-btn {
            background: #111;
            border: 1px solid #333;
            color: var(--accent-3);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }
        .map-control-btn:hover {
            background: var(--accent-3);
            color: white;
        }
        .header-controls {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #222;
        }
        .map-switch-btn, .home-btn {
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }
        .map-switch-btn:hover, .home-btn:hover { background: #222; }
        .map-switch-btn.active { background: var(--accent-3); border-color: var(--accent-3); }

        .home-btn {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        /* Personalizzazione Popup Leaflet */
        .leaflet-popup-content-wrapper {
            background: #111 !important;
            color: white !important;
            border-radius: 1rem !important;
            border: 1px solid #333;
            padding: 0;
        }
        .leaflet-popup-content { margin: 0 !important; width: 220px !important; }
        .leaflet-popup-tip { background: #111 !important; }
        
        .popup-card { display: flex; flex-direction: column; }
        .popup-info { padding: 15px; }
        .popup-info h3 { margin: 0 0 5px; font-size: 1.1rem; color: var(--accent-3); }
        .popup-info p { margin: 0; font-size: 0.85rem; opacity: 0.9; line-height: 1.4; }

        /* Stile per l'icona della nave AIS */
        .ship-marker-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ship-icon-svg {
            fill: var(--accent-3);
            stroke: white;
            stroke-width: 1px;
        }
        /* Numeri sopra le tappe */
        .marker-label {
            background: #111;
            border: 1px solid var(--accent-3);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .marker-label:hover { transform: scale(1.2); background: var(--accent-3); }

        #calendar-view {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            padding: 30px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .calendar-day {
            background-size: cover;
            background-position: center;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 100px;
            transition: all 0.3s ease;
        }
        .calendar-day.cruise { border-color: var(--accent-3); border-width: 2px; }
        .calendar-day.today { background-color: rgba(6, 182, 212, 0.4); border-color: white; box-shadow: 0 0 20px rgba(6, 182, 212, 0.3); }
        .calendar-day.past { opacity: 0.4; }
        .calendar-day .day-num { font-size: 1.5rem; font-weight: 900; color: white; white-space: nowrap; }
        .calendar-dest { font-size: 0.75rem; color: var(--accent-3); font-weight: 700; text-transform: uppercase; line-height: 1.2; }

        /* Zoom Full-Screen */
        .calendar-day.expanded {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            margin: 0 !important;
            border-radius: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: zoom-out;
        }
        .calendar-day.expanded .day-num { font-size: 4rem; }
        .calendar-day.expanded .calendar-dest { font-size: 2rem; }
    </style>
</head>
<body>
    <header>
        <div class="header-controls">
            <a href="index.htm" class="home-btn" title="Home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </a>
            <button class="map-switch-btn" id="open-calendar" title="Calendario" style="display: flex; align-items: center; padding: 8px 12px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </button>
            <button class="map-switch-btn" id="show-vessel">Vessel</button>
            <button class="map-switch-btn" id="show-marine">Marine</button>
        </div>
        <div class="map-wrapper">
            <div id="osm-map"></div>
            <div id="vessel-map-container"></div>
            <div id="marine-map-container"></div>
            <div id="calendar-view">
                <div class="calendar-container">
                    <div id="calendar-content"></div>
                </div>
            </div>
            <div class="map-controls-top-right" id="map-overlays">
                <button id="center-map-btn" class="map-control-btn">Centra Mappa</button>
                <button id="toggle-path-btn" class="map-control-btn">Mostra percorso passato</button>
            </div>
        </div>
    </header>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function toggleExpand(el) {
            el.classList.toggle('expanded');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();

            // --- CONFIGURAZIONE POSIZIONE REALE ---
            // Se vuoi forzare la posizione della nave (es. presa da MarineTraffic), 
            // inserisci le coordinate qui [lat, lon]. Se null, usa l'itinerario.
            const manualAISPosition = null;
            let shipMarker;

            // Configurazione Mappa Interattiva (OpenStreetMap)
            const osmMap = L.map('osm-map', {
                zoomControl: true,
                attributionControl: false
            }).setView([40.0, 0.0], 5);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 18
            }).addTo(osmMap);

            // Forza il ricalcolo delle dimensioni per evitare che la mappa appaia grigia o invisibile
            setTimeout(() => { osmMap.invalidateSize(); }, 100);

            const cruiseDestinations = [
                { id: "buenos-aires", name: "Buenos Aires", coords: [-34.6037, -58.3816], date: "13 Mar 2026", info: "Partenza 19:00" },
                { id: "mar-14", name: "In Navigazione", coords: [-31.0, -50.0], date: "14 Mar 2026", info: "Oceano Atlantico" },
                { id: "mar-15", name: "In Navigazione", coords: [-27.0, -45.0], date: "15 Mar 2026", info: "Oceano Atlantico" },
                { id: "rio", name: "Rio de Janeiro", coords: [-22.9068, -43.1729], date: "16 Mar 2026", info: "12:00 - 20:00" },
                { id: "mar-17", name: "In Navigazione", coords: [-18.0, -39.0], date: "17 Mar 2026", info: "Costa Brasiliana" },
                { id: "mar-18", name: "In Navigazione", coords: [-13.0, -36.0], date: "18 Mar 2026", info: "Costa Brasiliana" },
                { id: "recife", name: "Recife", coords: [-8.0578, -34.8778], date: "19 Mar 2026", info: "10:00 - 19:30" },
                { id: "mar-20", name: "In Navigazione", coords: [-4.0, -32.0], date: "20 Mar 2026", info: "Traversata Atlantica" },
                { id: "mar-21", name: "In Navigazione", coords: [1.0, -30.0], date: "21 Mar 2026", info: "Passaggio Equatore" },
                { id: "mar-22", name: "In Navigazione", coords: [6.0, -28.0], date: "22 Mar 2026", info: "Traversata Atlantica" },
                { id: "mar-23", name: "In Navigazione", coords: [11.0, -26.0], date: "23 Mar 2026", info: "Traversata Atlantica" },
                { id: "mindelo", name: "Mindelo", coords: [16.8901, -24.9923], date: "24 Mar 2026", info: "08:00 - 18:00" },
                { id: "mar-25", name: "In Navigazione", coords: [21.0, -22.0], date: "25 Mar 2026", info: "Verso le Canarie" },
                { id: "mar-26", name: "In Navigazione", coords: [25.0, -19.0], date: "26 Mar 2026", info: "Verso le Canarie" },
                { id: "tenerife", name: "Santa Cruz de Tenerife", coords: [28.4636, -16.2518], date: "27 Mar 2026", info: "08:00 - 16:00" },
                { id: "mar-28", name: "In Navigazione", coords: [32.0, -11.0], date: "28 Mar 2026", info: "Verso Tangeri" },
                { id: "tangeri", name: "Tangier", coords: [35.7595, -5.8340], date: "29 Mar 2026", info: "09:00 - 19:00" },
                { id: "mar-30", name: "In Navigazione", coords: [37.2, -0.5], date: "30 Mar 2026", info: "Mar Mediterraneo" },
                { id: "barcelona-1", name: "Barcelona", coords: [41.3851, 2.1734], date: "31 Mar 2026", info: "08:00 - 18:00" },
                { id: "marseille-1", name: "Marseille", coords: [43.2965, 5.3698], date: "01 Apr 2026", info: "08:00 - 17:00" },
                { id: "savona", name: "Savona", coords: [44.3129, 8.4764], date: "02 Apr 2026", info: "Arrivo 08:00 / Partenza 17:30" },
                { id: "marsiglia", name: "Marsiglia", coords: [43.2965, 5.3698], date: "03 Apr 2026", info: "09:00 - 18:00" },
                { id: "day-3", name: "In Navigazione", coords: [41.5, 3.5], date: "04 Apr 2026", info: "Mar Mediterraneo" },
                { id: "valencia", name: "Valencia", coords: [39.4699, -0.3763], date: "05 Apr 2026", info: "08:00 - 18:00" },
                { id: "cartagena", name: "Cartagena", coords: [37.6051, -0.9862], date: "06 Apr 2026", info: "08:00 - 18:00" },
                { id: "malaga", name: "Malaga", coords: [36.7213, -4.4214], date: "07 Apr 2026", info: "08:00 - 18:00" },
                { id: "cadice", name: "Cadice", coords: [36.5298, -6.2947], date: "08 Apr 2026", info: "07:00 - 16:00" },
                { id: "lisbona", name: "Lisbona", coords: [38.7223, -9.1393], date: "09 Apr 2026", info: "08:00 - 16:00" },
                { id: "day-9", name: "In Navigazione", coords: [36.5, -2.2], date: "10 Apr 2026", info: "Mar di Alborán" },
                { id: "alicante", name: "Alicante", coords: [38.3452, -0.4810], date: "11 Apr 2026", info: "09:30 - 16:30" },
                { id: "barcellona", name: "Barcellona", coords: [41.3851, 2.1734], date: "12 Apr 2026", info: "07:00 - 13:00" },
                { id: "day-12", name: "Savona (Ritorno)", coords: [44.3129, 8.4764], date: "13 Apr 2026", info: "Arrivo 09:00" }
            ];

            // Mapping date -> ID per animazione pulsante
            const cruiseSchedule = {
                "2026-03-13": "buenos-aires", "2026-03-14": "mar-14", "2026-03-15": "mar-15",
                "2026-03-16": "rio", "2026-03-17": "mar-17", "2026-03-18": "mar-18",
                "2026-03-19": "recife", "2026-03-20": "mar-20", "2026-03-21": "mar-21",
                "2026-03-22": "mar-22", "2026-03-23": "mar-23", "2026-03-24": "mindelo",
                "2026-03-25": "mar-25", "2026-03-26": "mar-26", "2026-03-27": "tenerife",
                "2026-03-28": "mar-28", "2026-03-29": "tangeri", "2026-03-30": "mar-30",
                "2026-03-31": "barcelona-1", "2026-04-01": "marseille-1",
                "2026-04-02": "savona", "2026-04-03": "marsiglia", "2026-04-04": "day-3",
                "2026-04-05": "valencia", "2026-04-06": "cartagena", "2026-04-07": "malaga",
                "2026-04-08": "cadice", "2026-04-09": "lisbona", "2026-04-10": "day-9",
                "2026-04-11": "alicante", "2026-04-12": "barcellona", "2026-04-13": "day-12"
            };
            
            const todayKey = now.getFullYear() + '-' + 
                             String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                             String(now.getDate()).padStart(2, '0');
            const activeId = cruiseSchedule[todayKey];
            const scheduleKeys = Object.keys(cruiseSchedule);
            const activeIndex = scheduleKeys.indexOf(todayKey);
            
            // Funzione per generare una curva fluida tra punti (Catmull-Rom Spline)
            const getCurvedPath = (points, tension = 0.4, segments = 15) => {
                if (points.length < 3) return points;
                const curvedPoints = [];
                for (let i = 0; i < points.length - 1; i++) {
                    const p0 = (i === 0) ? points[i] : points[i - 1];
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const p3 = (i + 2 >= points.length) ? p2 : points[i + 2];
                    for (let t = 0; t < segments; t++) {
                        const t1 = t / segments;
                        const t2 = t1 * t1;
                        const t3 = t2 * t1;
                        const f1 = -tension * t3 + 2 * tension * t2 - tension * t1;
                        const f2 = (2 - tension) * t3 + (tension - 3) * t2 + 1;
                        const f3 = (tension - 2) * t3 + (3 - 2 * tension) * t2 + tension * t1;
                        const f4 = tension * t3 - tension * t2;
                        curvedPoints.push([
                            p0[0] * f1 + p1[0] * f2 + p2[0] * f3 + p3[0] * f4,
                            p0[1] * f1 + p1[1] * f2 + p2[1] * f3 + p3[1] * f4
                        ]);
                    }
                }
                curvedPoints.push(points[points.length - 1]);
                return curvedPoints;
            };

            let activeCoords = null;
            const todayDest = cruiseDestinations.find(d => d.id === activeId);
            if (todayDest) activeCoords = todayDest.coords;

            const shipFinalPos = manualAISPosition || activeCoords;

            // Definizione dei segmenti della rotta con waypoint nautici per evitare la terraferma
            const cruisePathSegments = [
                [[-34.6037, -58.3816], [-35.0, -55.0], [-31.0, -50.0]], // BA -> Nav
                [[-31.0, -50.0], [-27.0, -45.0]], // Nav -> Nav
                [[-27.0, -45.0], [-23.0, -42.0], [-22.9068, -43.1729]], // Nav -> Rio
                [[-22.9068, -43.1729], [-20.0, -38.0], [-18.0, -39.0]], // Rio -> Nav
                [[-18.0, -39.0], [-15.0, -38.0], [-13.0, -36.0]], // Nav -> Nav
                [[-13.0, -36.0], [-10.0, -35.0], [-8.0578, -34.8778]], // Nav -> Recife
                [[-8.0578, -34.8778], [-4.0, -32.0]], // Recife -> Nav
                [[-4.0, -32.0], [1.0, -30.0]], // Nav -> Nav
                [[1.0, -30.0], [6.0, -28.0]], // Nav -> Nav
                [[6.0, -28.0], [11.0, -26.0]], // Nav -> Nav
                [[11.0, -26.0], [16.8901, -24.9923]], // Nav -> Mindelo
                [[16.8901, -24.9923], [21.0, -22.0]], // Mindelo -> Nav
                [[21.0, -22.0], [25.0, -19.0]], // Nav -> Nav
                [[25.0, -19.0], [27.0, -19.0], [29.0, -18.0], [28.4636, -16.2518]], // Nav -> Tenerife (con waypoint per evitare la terra)
                [[28.4636, -16.2518], [32.0, -11.0]], // Tenerife -> Nav
                [[32.0, -11.0], [35.0, -8.0], [35.7595, -5.8340]], // Nav -> Tangeri
                [[35.7595, -5.8340], [36.1, -4.5], [36.8, -1.5], [37.2, -0.5]], // Tangeri -> Nav (-4 a -3)
                [[37.2, -0.5], [39.0, 0.5], [41.3851, 2.1734]], // Nav -> Barcelona
                [[41.3851, 2.1734], [42.5, 4.5], [43.2965, 5.3698]], // Barcelona -> Marseille (-2 a -1)
                [[43.2965, 5.3698], [43.0, 6.0], [43.3, 7.3], [44.0, 8.2], [44.3129, 8.4764]], // Marseille -> Savona (-1 a 1)
                [[44.3129, 8.4764], [44.0, 8.2], [43.3, 7.3], [43.0, 6.0], [43.2965, 5.3698]], // Savona -> Marsiglia (1 a 2)
                [[43.2965, 5.3698], [42.0, 4.5], [41.5, 3.5]],      // Marsiglia -> Nav
                [[41.5, 3.5], [40.0, 1.0], [39.4699, -0.3763]],     // Nav -> Valencia
                [[39.4699, -0.3763], [38.5, 0.5], [37.6051, -0.9862]], // Valencia -> Cartagena
                [[37.6051, -0.9862], [36.4, -2.2], [36.5, -3.5], [36.7213, -4.4214]], // Cartagena -> Malaga
                [[36.7213, -4.4214], [35.9, -5.5], [36.5298, -6.2947]], // Malaga -> Cadice
                [[36.5298, -6.2947], [35.8, -7.5], [36.8, -9.2], [38.7223, -9.1393]], // Cadice -> Lisbona
                [[38.7223, -9.1393], [36.8, -9.2], [35.8, -7.5], [35.9, -5.5], [36.5, -2.2]], // Lisbona -> Nav
                [[36.5, -2.2], [37.4, -0.7], [38.3452, -0.4810]],   // Nav -> Alicante
                [[38.3452, -0.4810], [38.7, 0.5], [40.5, 1.5], [41.3851, 2.1734]], // Alicante -> Barcellona
                [[41.3851, 2.1734], [42.5, 4.5], [43.8, 8.0], [44.3129, 8.4764]]  // Barcellona -> Savona
            ];

            const pastPolylines = [];
            for (let i = 0; i < cruisePathSegments.length; i++) {
                const isPast = activeIndex !== -1 && i < activeIndex;
                const segmentColor = isPast ? '#4f46e5' : '#06b6d4';
                const segmentOpacity = isPast ? 0.8 : 0.4;
                const segmentDash = isPast ? '' : '5, 10';
                
                const poly = L.polyline(getCurvedPath(cruisePathSegments[i]), {
                    color: segmentColor,
                    weight: 4,
                    opacity: segmentOpacity,
                    dashArray: segmentDash
                });
                if (isPast) {
                    pastPolylines.push(poly);
                } else {
                    poly.addTo(osmMap);
                }
            }

            const savonaIndex = cruiseDestinations.findIndex(d => d.id === "savona");
            const usedPositions = [];
            const pastMarkers = [];

            cruiseDestinations.forEach((dest, index) => {
                const dayNum = index < savonaIndex ? index - savonaIndex : index - savonaIndex + 1;
                
                // Gestione sovrapposizioni: calcola offset se la posizione è già occupata
                let displayCoords = [dest.coords[0], dest.coords[1]];
                let foundCollision = true;
                while (foundCollision) {
                    foundCollision = usedPositions.some(pos => 
                        Math.abs(pos[0] - displayCoords[0]) < 0.03 && 
                        Math.abs(pos[1] - displayCoords[1]) < 0.03
                    );
                    if (foundCollision) {
                        displayCoords[0] += 0.04; // Offset ridotto per rendere i punti vicinissimi
                        displayCoords[1] += 0.04;
                    }
                }
                usedPositions.push([...displayCoords]);

                const popupHtml = `
                    <div class="popup-card">
                        <div class="popup-info">
                            <h3>Giorno ${dayNum}: ${dest.name}</h3>
                            <p><strong>${dest.date}</strong></p>
                            <p>${dest.info}</p>
                        </div>
                    </div>
                `;

                // Il numero cerchiato diventa il marker principale e cliccabile
                const marker = L.marker(displayCoords, {
                    icon: L.divIcon({
                        className: 'marker-label',
                        html: `<span>${dayNum}</span>`,
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    })
                }).bindPopup(popupHtml, {
                    maxWidth: 220,
                    className: 'custom-cruise-popup'
                });

                if (activeIndex !== -1 && index < activeIndex) {
                    pastMarkers.push(marker);
                } else {
                    marker.addTo(osmMap);
                }
            });

            // Disegna l'icona della nave sulla posizione corretta
            if (shipFinalPos) {
                const shipIcon = L.divIcon({
                    className: 'ship-marker-container',
                    html: `
                        <svg class="ship-icon-svg" viewBox="0 0 24 24" width="36" height="36" style="filter: drop-shadow(0 0 5px black);">
                            <path d="M4,15C4,15 5,18 12,18C19,18 20,15 20,15L22,13L20,11L4,11L2,13L4,15Z M10,11L11,5L13,5L14,11L10,11Z" stroke-width="2" />
                        </svg>
                    `,
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });

                // zIndexOffset molto alto per stare sopra i numeri delle tappe
                shipMarker = L.marker(shipFinalPos, { icon: shipIcon, zIndexOffset: 5000 })
                    .addTo(osmMap);
                
                osmMap.setView(shipFinalPos, 6);

                // --- INTEGRAZIONE HOME ASSISTANT ---
                function updateLivePosition() {
                    fetch('position.json', { cache: "no-store" })
                        .then(response => response.json())
                        .then(data => {
                            if (data.lat && data.lon && data.lat !== 0 && data.lon !== 0) {
                                const livePos = [data.lat, data.lon];
                                shipMarker.setLatLng(livePos);
                                // Non usiamo setView qui per non disturbare l'utente mentre naviga la mappa
                                console.log("Posizione aggiornata da Home Assistant:", livePos);
                            }
                        })
                        .catch(err => console.log("Errore caricamento posizione live."));
                }

                updateLivePosition();
                setInterval(updateLivePosition, 60000); // Controlla ogni minuto
            } else {
                osmMap.fitBounds(L.polyline(pathCoords).getBounds(), { padding: [30, 30] });
            }

            // GESTIONE SWITCH MAPPE
            const osmEl = document.getElementById('osm-map');
            const vesselContainer = document.getElementById('vessel-map-container');
            const marineContainer = document.getElementById('marine-map-container');
            const centerBtn = document.getElementById('center-map-btn');
            const mapOverlays = document.getElementById('map-overlays');
            const togglePathBtn = document.getElementById('toggle-path-btn');
            let pastVisible = false;

            togglePathBtn.addEventListener('click', () => {
                pastVisible = !pastVisible;
                pastPolylines.forEach(p => pastVisible ? p.addTo(osmMap) : p.remove());
                pastMarkers.forEach(m => pastVisible ? m.addTo(osmMap) : m.remove());
                togglePathBtn.textContent = pastVisible ? "Nascondi percorso passato" : "Mostra percorso passato";
            });

            const switchBtns = document.querySelectorAll('.map-switch-btn');
            const calendarView = document.getElementById('calendar-view');

            const hideAll = () => {
                [osmEl, vesselContainer, marineContainer, calendarView].forEach(el => el.style.display = 'none');
                mapOverlays.style.display = 'none';
                switchBtns.forEach(btn => btn.classList.remove('active'));
            };

            // Gestione Calendario
            document.getElementById('open-calendar').addEventListener('click', () => {
                hideAll();
                renderCalendar();
                calendarView.style.display = 'block';
            });

            function renderCalendar() {
                const content = document.getElementById('calendar-content');
                const today = new Date();
                let html = '<h1 style="text-align:center; color:var(--accent-3); margin-bottom:40px; font-weight:900; text-transform:uppercase; letter-spacing:3px;">Itinerario 2026</h1><div class="calendar-grid">';
                
                // Genera date dal 31 Marzo al 13 Aprile
                const start = new Date(2026, 3, 2); // 2 Aprile
                const end = new Date(2026, 3, 13);   // 13 Aprile
                
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    const dateStr = d.getFullYear() + '-' + 
                                     String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                                     String(d.getDate()).padStart(2, '0');
                    const dateObj = new Date(d);
                    const isCruise = cruiseSchedule[dateStr];
                    const isToday = dateStr === todayKey;
                    const isPast = dateObj < today && !isToday;
                    
                    const dayName = d.toLocaleDateString('it-IT', { weekday: 'short' }).toUpperCase().replace('.', '');
                    const dayNum = d.getDate();

                    let destName = '';
                    // Prova a usare un'immagine chiamata come la data (es. 2026-04-02.jpg)
                    let bgImg = `${dateStr}.jpg`; 

                    if (isCruise) {
                        const dest = cruiseDestinations.find(d => d.id === isCruise);
                        if (dest) {
                            destName = `<div class="calendar-dest">${dest.name}</div>`;
                            if (dest.img && dest.img !== '1.jpg') bgImg = dest.img;
                        }
                    }
                    
                    html += `
                        <div class="calendar-day ${isCruise ? 'cruise' : ''} ${isToday ? 'today' : ''} ${isPast ? 'past' : ''}" 
                             style="background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${bgImg}'), url('1.jpg')" 
                             onclick="toggleExpand(this)">
                            <span class="day-num">${dayName} ${dayNum}</span>
                            ${destName}
                        </div>`;
                }
                html += '</div>';
                content.innerHTML = html;
            }

            document.getElementById('show-vessel').addEventListener('click', function() {
                hideAll();
                this.classList.add('active');
                vesselContainer.style.display = 'block';
                vesselContainer.innerHTML = `<iframe src="https://www.vesselfinder.com/aismap?imo=9479852&zoom=5&track=true" style="width:100%; height:100%; border:none;"></iframe>`;
            });

            document.getElementById('show-marine').addEventListener('click', function() {
                hideAll();
                this.classList.add('active');
                marineContainer.style.display = 'block';
                const lat = shipFinalPos ? shipFinalPos[0] : 41.123;
                const lon = shipFinalPos ? shipFinalPos[1] : 12.456;
                marineContainer.innerHTML = `<iframe src="https://www.marinetraffic.com/en/ais/embed/zoom:12/centery:${lat}/centerx:${lon}/maptype:0/shownames:false/mmsi:0/shipid:0/trackvessel:247311100/showmenu:true/remember:false" style="width:100%; height:100%; border:none;"></iframe>`;
            });

            if (shipFinalPos) {
                centerBtn.addEventListener('click', () => {
                    osmMap.flyTo(shipFinalPos, 10, { animate: true, duration: 1.5 });
                });
            } else {
                centerBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
