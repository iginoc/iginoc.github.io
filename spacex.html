<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceX Launch Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #111111;
            --accent: #06b6d4;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .dashboard-container {
            text-align: center;
            max-width: 800px;
            width: 90%;
            padding: 40px;
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .mission-badge {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.3));
        }

        h1 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .mission-name {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0 0 30px 0;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .countdown-item {
            background: #1a1a1a;
            padding: 20px 10px;
            border-radius: 1rem;
            border: 1px solid #333;
        }

        .time-value {
            font-size: 2.5rem;
            font-weight: 700;
            display: block;
        }

        .time-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .details {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .home-link {
            margin-top: 30px;
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            border-bottom: 1px solid transparent;
            transition: all 0.3s;
        }

        .home-link:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <img id="mission-patch" src="" alt="Patch" class="mission-badge" style="display: none;">
        <h1>Next SpaceX Launch</h1>
        <p id="mission-name" class="mission-name">Caricamento...</p>

        <div class="countdown-grid">
            <div class="countdown-item"><span id="days" class="time-value">00</span><span class="time-label">Giorni</span></div>
            <div class="countdown-item"><span id="hours" class="time-value">00</span><span class="time-label">Ore</span></div>
            <div class="countdown-item"><span id="minutes" class="time-value">00</span><span class="time-label">Minuti</span></div>
            <div class="countdown-item"><span id="seconds" class="time-value">00</span><span class="time-label">Secondi</span></div>
        </div>

        <p id="details" class="details"></p>
        
        <a href="index.htm" class="home-link">← Torna all'Itinerario</a>
    </div>

    <script>
        async function fetchLaunchData() {
            try {
                const response = await fetch('https://api.spacexdata.com/v5/launches/next');
                const data = await response.json();
                
                console.log("Dati del prossimo lancio da SpaceX API:", data); // Aggiunto per debug

                document.getElementById('mission-name').innerText = data.name;
                document.getElementById('details').innerText = data.details || "Nessun dettaglio disponibile per questa missione.";
                
                if(data.links.patch.small) {
                    const patchImg = document.getElementById('mission-patch');
                    patchImg.src = data.links.patch.small;
                    patchImg.style.display = 'block'; // Changed to block for better centering
                }

                const launchDate = new Date(data.date_utc).getTime();

                const timer = setInterval(() => {
                    const now = new Date().getTime();
                    let distance = launchDate - now;

                    if (distance < 0) {
                        clearInterval(timer);
                        document.getElementById('days').innerText = "00";
                        document.getElementById('hours').innerText = "00";
                        document.getElementById('minutes').innerText = "00";
                        document.getElementById('seconds').innerText = "00";
                        document.getElementById('mission-name').innerText = data.name + " (Lanciato!)";
                        document.getElementById('details').innerText = "Questo lancio è già avvenuto.";
                    } else {
                        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                        document.getElementById('days').innerText = days.toString().padStart(2, '0');
                        document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
                        document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
                        document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
                    }

                }, 1000);

            } catch (error) {
                console.error("Errore nel recupero dati:", error);
                document.getElementById('mission-name').innerText = "Errore caricamento";
            }
        }
        fetchLaunchData();
    </script>
</body>
</html>
